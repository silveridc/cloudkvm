syntax = "proto3";

import "google/protobuf/empty.proto";

option csharp_namespace = "Kvm.Contracts";
package kvm.cluster.v1;

service ClusterAgent {
  rpc GetHostStatus(HostStatusRequest) returns (HostStatusReply);
  rpc ListVirtualMachines(ListVirtualMachinesRequest) returns (ListVirtualMachinesReply);
  rpc GetVirtualMachine(VirtualMachineRequest) returns (VirtualMachineReply);
  rpc ChangeVirtualMachinePowerState(ChangePowerStateRequest) returns (ChangePowerStateReply);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksReply);
  rpc CreateBridge(CreateBridgeRequest) returns (NetworkReply);
  rpc DeleteBridge(DeleteBridgeRequest) returns (google.protobuf.Empty);
  rpc ListNatRules(ListNatRulesRequest) returns (ListNatRulesReply);
  rpc CreateNatRule(CreateNatRuleRequest) returns (NatRuleReply);
  rpc DeleteNatRule(DeleteNatRuleRequest) returns (google.protobuf.Empty);
  rpc CreateVirtualMachine(CreateVirtualMachineRequest) returns (VirtualMachineReply);
  rpc DeleteVirtualMachine(DeleteVirtualMachineRequest) returns (google.protobuf.Empty);
  rpc GetVirtualMachineConfig(VirtualMachineRequest) returns (VirtualMachineConfigReply);
  rpc UpdateVirtualMachineConfig(UpdateVirtualMachineConfigRequest) returns (UpdateVirtualMachineConfigReply);
  rpc ResizeVirtualMachineDisk(ResizeVirtualMachineDiskRequest) returns (ResizeVirtualMachineDiskReply);
  rpc OpenVncConsole(OpenVncConsoleRequest) returns (OpenVncConsoleReply);
  rpc GetNodeMetrics(NodeMetricsRequest) returns (NodeMetricsReply);
  rpc ProxyVnc(stream VncProxyFrame) returns (stream VncProxyFrame);
}

message NodeMetricsRequest {}

message NodeMetricsReply {
  HostMetrics host = 1;
  repeated VirtualMachineMetrics virtual_machines = 2;
}

// /proc/stat 读取必须做两点差值求导!
// 如果某个字段没给值（即 HasXxx == false），说明这时候根本测不准，千万别直接随便一个默认值丢上去。另外，CPU 使用率必须对比两次采样才能算出来差值，所以第一次调用时肯定是没有这个数值的。
// Reading /proc/stat requires computing the delta between two sampling points.
// If a field is not set (i.e., HasXxx == false), it indicates the metric cannot be reliably measured
// at that moment; do not populate it with an arbitrary default value.
// Additionally, CPU usage calculation requires two samples to compute the difference,
// so this value will not be present on the initial invocation.
message HostMetrics {
  optional double cpu_usage_ratio = 1;
  optional uint32 logical_cpu_count = 2;
  optional uint64 memory_total_bytes = 3;
  optional uint64 memory_available_bytes = 4;
  string virtual_machine_directory = 5;
  optional uint64 disk_total_bytes = 6;
  optional uint64 disk_available_bytes = 7;
  optional uint64 uptime_seconds = 8;
}

message VirtualMachineMetrics {
  string name = 1;
  optional double cpu_usage_ratio = 2;
  optional uint64 memory_used_bytes = 3;
  optional uint32 allocated_virtual_cpu_count = 4;
  optional uint64 allocated_memory_bytes = 5;
}

message HostStatusRequest {}

message HostStatusReply {
  string host_name = 1;
  string libvirt_uri = 2;
  string hypervisor_type = 3;
  string hypervisor_version = 4;
}

message ListVirtualMachinesRequest {}

message VirtualMachineRequest {
  string name = 1;
}

enum VirtualMachineState {
  VIRTUAL_MACHINE_STATE_UNSPECIFIED = 0;
  VIRTUAL_MACHINE_STATE_RUNNING = 1;
  VIRTUAL_MACHINE_STATE_BLOCKED = 2;
  VIRTUAL_MACHINE_STATE_PAUSED = 3;
  VIRTUAL_MACHINE_STATE_SHUTDOWN = 4;
  VIRTUAL_MACHINE_STATE_SHUTOFF = 5;
  VIRTUAL_MACHINE_STATE_CRASHED = 6;
  VIRTUAL_MACHINE_STATE_PMSUSPENDED = 7;
}

message VirtualMachine {
  string name = 1;
  string uuid = 2;
  int32 id = 3;
  VirtualMachineState state = 4;
  uint64 memory_mib = 5;
  uint32 virtual_cpu_count = 6;
  bool persistent = 7;
}

message ListVirtualMachinesReply {
  repeated VirtualMachine virtual_machines = 1;
}

message VirtualMachineReply {
  VirtualMachine virtual_machine = 1;
}

enum VirtualMachinePowerAction {
  VIRTUAL_MACHINE_POWER_ACTION_UNSPECIFIED = 0;
  VIRTUAL_MACHINE_POWER_ACTION_START = 1;
  VIRTUAL_MACHINE_POWER_ACTION_SHUTDOWN = 2;
  VIRTUAL_MACHINE_POWER_ACTION_REBOOT = 3;
  VIRTUAL_MACHINE_POWER_ACTION_FORCE_OFF = 4;
}

message ChangePowerStateRequest {
  string name = 1;
  VirtualMachinePowerAction action = 2;
}

message ChangePowerStateReply {
  VirtualMachine virtual_machine = 1;
}

enum BridgeType {
  BRIDGE_TYPE_UNSPECIFIED = 0;
  BRIDGE_TYPE_LINUX = 1;
  BRIDGE_TYPE_OPEN_VSWITCH = 2;
}

message ListNetworksRequest {}

message Network {
  string name = 1;
  BridgeType type = 2;
  repeated string ports = 3;
  bool up = 4;
}

message ListNetworksReply {
  repeated Network networks = 1;
}

message CreateBridgeRequest {
  string name = 1;
  BridgeType type = 2;
  repeated string ports = 3;
}

message DeleteBridgeRequest {
  string name = 1;
  BridgeType type = 2;
}

message NatRule {
  string id = 1;
  string protocol = 2;
  string listen_address = 3;
  uint32 listen_port = 4;
  string target_address = 5;
  uint32 target_port = 6;
}

message ListNatRulesRequest {}

message ListNatRulesReply {
  repeated NatRule rules = 1;
}

message CreateNatRuleRequest {
  string protocol = 1;
  string listen_address = 2;
  uint32 listen_port = 3;
  string target_address = 4;
  uint32 target_port = 5;
}

message DeleteNatRuleRequest {
  string id = 1;
}

message NetworkReply {
  Network network = 1;
}

message NatRuleReply {
  NatRule rule = 1;
}

message CreateVirtualMachineRequest {
  string name = 1;
  uint64 memory_mib = 2;
  uint32 virtual_cpu_count = 3;
  string base_image = 4;
  string bridge_name = 5;
  string mac_address = 6;
  CloudInitConfig cloud_init = 7;
  bool start = 8;
}

message DeleteVirtualMachineRequest {
  string name = 1;
  bool force = 2;
  bool delete_storage = 3;
}

message CloudInitConfig {
  string user_name = 1;
  repeated string ssh_authorized_keys = 2;
  string ipv4_address = 3;
  string ipv4_gateway = 4;
  repeated string dns_servers = 5;
  string search_domain = 6;
}

message VirtualMachineSystemDisk {
  string file = 1;
  uint64 size_gib = 2;
}

message VirtualMachineConfig {
  string name = 1;
  VirtualMachineState state = 2;
  bool running = 3;
  uint32 persistent_virtual_cpu_count = 4;
  uint64 persistent_memory_mib = 5;
  uint32 live_virtual_cpu_count = 6;
  uint64 live_memory_mib = 7;
  VirtualMachineSystemDisk system_disk = 8;
}
// libvirt存在--config和--live live是不落盘的并且对运行的小鸡当前就生效，--config是落盘需要重开小鸡的
// In libvirt, configurations support `--config` and `--live` flags:
// `--live` applies directly to the currently running instance without persisting to disk;
// `--config` persists changes to disk, which take effect only after rebooting the VM.
message VirtualMachineConfigReply {
  VirtualMachineConfig config = 1;
}

message UpdateVirtualMachineConfigRequest {
  string name = 1;
  optional uint32 virtual_cpu_count = 2;
  optional uint64 memory_mib = 3;
  bool apply_live = 4;
}

message UpdateVirtualMachineConfigReply {
  bool persistent_applied = 1;
  bool live_applied = 2;
  string live_message = 3;
  uint32 persistent_virtual_cpu_count = 4;
  uint64 persistent_memory_mib = 5;
  uint32 live_virtual_cpu_count = 6;
  uint64 live_memory_mib = 7;
}

message ResizeVirtualMachineDiskRequest {
  string name = 1;
  uint64 size_gib = 2;
}

message ResizeVirtualMachineDiskReply {
  VirtualMachineSystemDisk system_disk = 1;
}

message OpenVncConsoleRequest {
  string name = 1;
}

message OpenVncConsoleReply {
  string session_id = 1;
  string password = 2;
}
// h2 vnc透传
// HTTP/2 streaming proxy frame for VNC traffic.
message VncProxyFrame {
  string session_id = 1;
  bytes data = 2;
}
