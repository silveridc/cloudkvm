<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <title>KVM Console</title>
    <style>
        html, body, #screen { height: 100%; margin: 0; background: #1d1f21; }
    </style>
</head>
<body>
    <div id="screen"></div>
    <script type="module">
        import RFB from './core/rfb.js';

        const credentials = new URLSearchParams(window.location.hash.slice(1));
        const password = credentials.get('password');
        history.replaceState(null, '', window.location.pathname);
        if (!password) {
            document.body.textContent = 'Missing console credentials.';
            throw new Error('Missing console credentials.');
        }

        const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const url = `${scheme}://${window.location.host}/api/v1/consoles`;
        const rfb = new RFB(document.getElementById('screen'), url, { credentials: { password } });
        rfb.scaleViewport = true;
        rfb.resizeSession = true;
        rfb.addEventListener('desktopname', event => { document.title = event.detail.name; });
    </script>
</body>
</html>
